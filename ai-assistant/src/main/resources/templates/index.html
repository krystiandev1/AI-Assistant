<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDQ AI Assistant</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #1a1a1a;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #1a1a2e;
            color: #fff;
            padding: 16px 24px;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        header p {
            font-size: 0.8rem;
            color: #a0a8c0;
            margin-top: 2px;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 0 16px;
            min-height: 0;
        }

        #chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .message.user {
            align-self: flex-end;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
            color: #666;
        }

        .message.user .message-label { text-align: right; }

        .bubble {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.user .bubble {
            background: #1a1a2e;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .bubble {
            background: #fff;
            color: #1a1a1a;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .message.error .bubble {
            background: #fef2f2;
            border-color: #fca5a5;
            color: #991b1b;
        }

        .thinking {
            align-self: flex-start;
        }

        .thinking .bubble {
            background: #fff;
            border: 1px solid #e0e0e0;
            color: #666;
            font-style: italic;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #ddd;
            border-top-color: #1a1a2e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Evidence panel */
        .evidence-toggle {
            margin-top: 6px;
            font-size: 0.75rem;
            color: #555;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            padding: 2px 0;
        }

        .evidence-toggle:hover { color: #1a1a2e; }

        .evidence-panel {
            margin-top: 4px;
            background: #f8f9fc;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 0.78rem;
            color: #444;
            display: none;
        }

        .evidence-panel.open { display: block; }

        .evidence-section { margin-bottom: 8px; }
        .evidence-section:last-child { margin-bottom: 0; }

        .evidence-section h4 {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #888;
            margin-bottom: 4px;
        }

        .evidence-item {
            padding: 3px 0;
            border-bottom: 1px solid #ebebeb;
            line-height: 1.4;
        }
        .evidence-item:last-child { border-bottom: none; }

        .tag {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-right: 4px;
        }

        .tag-rag { background: #dbeafe; color: #1d4ed8; }
        .tag-mcp { background: #d1fae5; color: #065f46; }
        .tag-error { background: #fef2f2; color: #991b1b; }

        /* Input area */
        .input-area {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: #fff;
            border-top: 1px solid #e0e0e0;
            padding: 16px 0 12px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        #question-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d0d0d0;
            border-radius: 10px;
            font-size: 0.9rem;
            font-family: inherit;
            resize: none;
            line-height: 1.4;
            height: 48px;
            max-height: 160px;
            overflow-y: auto;
            outline: none;
            transition: border-color 0.15s;
        }

        #question-input:focus { border-color: #1a1a2e; }
        #question-input:disabled { background: #f5f5f5; }

        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s, background 0.15s;
            white-space: nowrap;
            height: 48px;
        }

        .btn-primary {
            background: #1a1a2e;
            color: #fff;
        }

        .btn-primary:hover:not(:disabled) { background: #2a2a4e; }
        .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

        .btn-secondary {
            background: #f0f0f0;
            color: #444;
            font-size: 0.8rem;
            padding: 6px 14px;
            height: auto;
        }

        .btn-secondary:hover { background: #e0e0e0; }

        /* Quick examples */
        .examples-panel {
            margin-top: 10px;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .examples-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .examples-panel-label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #999;
        }

        .examples-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            border: 1px solid #e4e4e8;
            border-radius: 8px;
            background: #fafafa;
            padding: 4px 0;
        }

        .examples-scroll::-webkit-scrollbar { width: 4px; }
        .examples-scroll::-webkit-scrollbar-track { background: transparent; }
        .examples-scroll::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

        .examples-group-head {
            font-size: 0.67rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            padding: 7px 12px 3px;
        }

        .head-country { color: #065f46; }
        .head-weather { color: #0369a1; }
        .head-rag     { color: #1d4ed8; }
        .head-model   { color: #6b7280; }
        .head-mixed   { color: #7c3aed; }

        .examples-divider {
            height: 1px;
            background: #ebebeb;
            margin: 4px 12px;
        }

        .example-item {
            display: block;
            width: 100%;
            text-align: left;
            font-size: 0.8rem;
            padding: 4px 12px 4px 22px;
            background: none;
            border: none;
            color: #333;
            cursor: pointer;
            font-family: inherit;
            line-height: 1.4;
            transition: background 0.1s;
        }

        .example-item:hover {
            background: #ededf5;
            color: #1a1a2e;
        }

        #empty-state {
            text-align: center;
            color: #aaa;
            margin: auto;
            padding: 40px 0;
            font-size: 0.9rem;
        }

        /* ── Tab bar ── */
        .tab-bar {
            display: flex;
            gap: 4px;
            padding: 12px 0 0;
            border-bottom: 2px solid #e0e0e0;
            flex-shrink: 0;
        }

        .tab-btn {
            padding: 6px 18px;
            border: none;
            background: none;
            font-size: 0.85rem;
            font-weight: 600;
            color: #888;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: color 0.15s, border-color 0.15s;
            font-family: inherit;
        }

        .tab-btn.active {
            color: #1a1a2e;
            border-bottom-color: #1a1a2e;
        }

        .tab-btn:hover:not(.active) { color: #444; }

        /* ── Debug / Routing tab ── */
        #debug-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 0;
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        #debug-area.active { display: flex; }

        #debug-empty {
            text-align: center;
            color: #aaa;
            margin: auto;
            padding: 40px 0;
            font-size: 0.9rem;
        }

        /* Flow card */
        .flow-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }

        .flow-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: #1a1a2e;
            color: #fff;
            gap: 12px;
        }

        .flow-question {
            font-size: 0.85rem;
            font-weight: 500;
            flex: 1;
        }

        .flow-time {
            font-size: 0.94rem;
            font-weight: 700;
            color: #ff4d4d;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .flow-body {
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        /* Individual flow step */
        .flow-step {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .flow-step-line {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            width: 28px;
        }

        .flow-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .flow-icon-mcp   { background: #d1fae5; }
        .flow-icon-rag   { background: #dbeafe; }
        .flow-icon-model { background: #f3e8ff; }
        .flow-icon-err   { background: #fef2f2; }

        .flow-body-empty-note {
            font-size: 0.78rem;
            color: #888;
            font-style: italic;
            padding: 6px 0 2px;
        }

        .flow-connector {
            width: 2px;
            height: 18px;
            background: #e0e0e0;
            margin: 2px 0;
        }

        .flow-content {
            padding-top: 4px;
            padding-bottom: 14px;
            flex: 1;
            min-width: 0;
        }

        .flow-step-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: #1a1a2e;
        }

        .flow-step-sub {
            font-size: 0.78rem;
            color: #666;
            margin-top: 1px;
        }

        .flow-step-list {
            margin: 4px 0 0 0;
            padding: 0;
            list-style: none;
        }

        .flow-step-list li {
            font-size: 0.78rem;
            color: #555;
            padding: 1px 0;
        }

        .flow-step-list li::before {
            content: "• ";
            color: #1d4ed8;
        }

        .flow-step-kind {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 2px;
            margin-bottom: 1px;
        }

        .flow-step-kind-mcp   { color: #065f46; }
        .flow-step-kind-rag   { color: #1d4ed8; }
        .flow-step-kind-model { color: #6d28d9; }

        .flow-step-model-box {
            background: #faf5ff;
            border: 1.5px solid #e9d5ff;
            border-radius: 8px;
            padding: 10px 14px;
            flex: 1;
        }
    </style>
</head>
<body>

<header>
    <h1>CDQ AI Assistant</h1>
    <p>Local AI assistant powered by Ollama, RAG and MCP</p>
</header>

<div class="main">
    <div class="tab-bar">
        <button class="tab-btn active" id="tab-chat" onclick="switchTab('chat')">Chat</button>
        <button class="tab-btn" id="tab-debug" onclick="switchTab('debug')">Debug / Routing</button>
    </div>

    <div id="chat-area">
        <div id="empty-state">Ask a question to get started.</div>
    </div>

    <div id="debug-area">
        <div id="debug-empty">No exchanges yet. Ask a question in the Chat tab.</div>
    </div>

    <div class="input-area">
        <div class="input-row">
            <textarea id="question-input"
                      placeholder="Ask a question..."
                      rows="1"
                      aria-label="Question"></textarea>
            <button class="btn btn-primary" id="send-btn" onclick="sendMessage()">Send</button>
        </div>

        <div class="examples-panel">
            <div class="examples-top-row">
                <span class="examples-panel-label">Try an example</span>
                <button class="btn btn-secondary" onclick="clearChat()">Clear chat</button>
            </div>

            <div class="examples-scroll">

                <div class="examples-group-head head-country">Country — get_country</div>
                <button class="example-item" onclick="fillExample('What is the capital city of Germany?')">What is the capital city of Germany?</button>

                <div class="examples-divider"></div>

                <div class="examples-group-head head-weather">Weather — get-weather</div>
                <button class="example-item" onclick="fillExample('What is the temperature currently in Munich?')">What is the temperature currently in Munich?</button>
                <button class="example-item" onclick="fillExample('What is the temperature of the capital of Germany currently?')">What is the temperature of the capital of Germany currently?</button>

                <div class="examples-divider"></div>

                <div class="examples-group-head head-rag">CDQ Fraud Guard — Knowledge Base (RAG)</div>
                <button class="example-item" onclick="fillExample('How does CDQ Fraud Guard reduce manual work?')">How does CDQ Fraud Guard reduce manual work?</button>
                <button class="example-item" onclick="fillExample('What is the Trust Score in CDQ Fraud Guard?')">What is the Trust Score in CDQ Fraud Guard?</button>

                <div class="examples-divider"></div>

                <div class="examples-group-head head-model">General Knowledge — LLM model</div>
                <button class="example-item" onclick="fillExample('What do you know about Berlin?')">What do you know about Berlin?</button>

                <div class="examples-divider"></div>

                <div class="examples-group-head head-mixed">Combined — RAG + MCP</div>
                <button class="example-item" onclick="fillExample('How does CDQ Fraud Guard reduce manual work and what is temperature in german capital currently?')">How does CDQ Fraud Guard reduce manual work and what is temperature in german capital currently?</button>

            </div>
        </div>
    </div>
</div>

<script>
    const chatArea = document.getElementById('chat-area');
    const debugArea = document.getElementById('debug-area');
    const input = document.getElementById('question-input');
    const sendBtn = document.getElementById('send-btn');
    const emptyState = document.getElementById('empty-state');
    const debugEmpty = document.getElementById('debug-empty');

    const exchanges = [];   // {question, answer, evidence, requestId}

    function switchTab(tab) {
        const isChat = tab === 'chat';
        document.getElementById('tab-chat').classList.toggle('active', isChat);
        document.getElementById('tab-debug').classList.toggle('active', !isChat);
        chatArea.style.display = isChat ? '' : 'none';
        debugArea.classList.toggle('active', !isChat);
    }

    function addDebugCard(exchange) {
        debugEmpty.style.display = 'none';

        const { question, answer, evidence, elapsedMs } = exchange;
        const toolCalls = evidence?.toolCalls ?? [];
        const ragDocs   = evidence?.ragDocuments ?? [];

        const card = document.createElement('div');
        card.className = 'flow-card';

        // Header: question + time
        const header = document.createElement('div');
        header.className = 'flow-header';
        const qEl = document.createElement('div');
        qEl.className = 'flow-question';
        qEl.textContent = question;
        header.appendChild(qEl);
        if (elapsedMs != null) {
            const timeEl = document.createElement('div');
            timeEl.className = 'flow-time';
            timeEl.textContent = 'time: ' + (elapsedMs / 1000).toFixed(1) + 's';
            header.appendChild(timeEl);
        }
        card.appendChild(header);

        // Body: flow steps
        const body = document.createElement('div');
        body.className = 'flow-body';

        const steps = [];

        // Build steps from tool calls (in order)
        toolCalls.forEach(tc => {
            const isErr = tc.invocationStatus === 'FAILED' || tc.outcome === 'ERROR';
            steps.push({ type: isErr ? 'err' : 'mcp', tc });
        });

        // RAG step (if any, collapsed into one)
        if (ragDocs.length > 0) {
            steps.push({ type: 'rag', docs: ragDocs });
        }

        // Model knowledge fallback
        if (steps.length === 0) {
            steps.push({ type: 'model' });
        }

        steps.forEach((step, idx) => {
            const isLast = idx === steps.length - 1;
            const stepEl = makeFlowStep(step);
            body.appendChild(stepEl.icon_col);
            // connector line between steps
            if (!isLast) {
                const conn = document.createElement('div');
                conn.className = 'flow-connector';
                conn.style.marginLeft = '13px';
                body.appendChild(conn);
            }
        });

        card.appendChild(body);
        debugArea.appendChild(card);
        debugArea.scrollTop = debugArea.scrollHeight;
    }

    function makeFlowStep(step) {
        const row = document.createElement('div');
        row.className = 'flow-step';

        const iconDiv = document.createElement('div');

        if (step.type === 'mcp' || step.type === 'err') {
            iconDiv.className = 'flow-icon ' + (step.type === 'err' ? 'flow-icon-err' : 'flow-icon-mcp');
            iconDiv.textContent = '⚙';

            const content = document.createElement('div');
            content.className = 'flow-content';

            const kind = document.createElement('div');
            kind.className = 'flow-step-kind flow-step-kind-mcp';
            kind.textContent = 'MCP Tool Call — external API via Model Context Protocol';
            content.appendChild(kind);

            const title = document.createElement('div');
            title.className = 'flow-step-title';
            title.textContent = step.tc.tool;
            content.appendChild(title);

            const sub = document.createElement('div');
            sub.className = 'flow-step-sub';
            const arg = extractMainArg(step.tc.argumentsJson);
            sub.textContent = arg ? 'argument: ' + arg : '';
            if (step.type === 'err') sub.textContent += (arg ? ' · ' : '') + '⚠ failed';
            content.appendChild(sub);

            row.appendChild(iconDiv);
            row.appendChild(content);
        } else if (step.type === 'rag') {
            iconDiv.className = 'flow-icon flow-icon-rag';
            iconDiv.textContent = '📄';

            const content = document.createElement('div');
            content.className = 'flow-content';

            const kind = document.createElement('div');
            kind.className = 'flow-step-kind flow-step-kind-rag';
            kind.textContent = 'Knowledge Base Retrieval — relevant sections fetched from CDQ Fraud Guard docs';
            content.appendChild(kind);

            const title = document.createElement('div');
            title.className = 'flow-step-title';
            title.textContent = step.docs.length + ' chunk' + (step.docs.length > 1 ? 's' : '') + ' retrieved';
            content.appendChild(title);

            const list = document.createElement('ul');
            list.className = 'flow-step-list';
            const sections = [...new Set(step.docs.map(d => d.section).filter(Boolean))];
            sections.forEach(s => {
                const li = document.createElement('li');
                li.textContent = s;
                list.appendChild(li);
            });
            content.appendChild(list);

            row.appendChild(iconDiv);
            row.appendChild(content);
        } else {
            iconDiv.className = 'flow-icon flow-icon-model';
            iconDiv.textContent = '🧠';

            const box = document.createElement('div');
            box.className = 'flow-step-model-box';

            const kind = document.createElement('div');
            kind.className = 'flow-step-kind flow-step-kind-model';
            kind.textContent = 'Built-in LLM Knowledge';
            box.appendChild(kind);

            const title = document.createElement('div');
            title.className = 'flow-step-title';
            title.textContent = 'Answered from model training data';
            box.appendChild(title);

            const sub = document.createElement('div');
            sub.className = 'flow-step-sub';
            sub.textContent = 'No external API calls · No document retrieval · Pure model knowledge';
            box.appendChild(sub);

            row.appendChild(iconDiv);
            row.appendChild(box);
        }

        return { icon_col: row };
    }

    function extractMainArg(argsJson) {
        try {
            const obj = JSON.parse(argsJson || '{}');
            const vals = Object.values(obj);
            return vals.length > 0 ? '"' + vals[0] + '"' : '';
        } catch { return ''; }
    }

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    });

    function fillExample(text) {
        input.value = text;
        input.focus();
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    }

    function clearChat() {
        chatArea.innerHTML = '';
        chatArea.appendChild(emptyState);
        emptyState.style.display = '';
        // Clear debug tab too
        while (debugArea.firstChild && debugArea.firstChild !== debugEmpty) {
            debugArea.removeChild(debugArea.firstChild);
        }
        Array.from(debugArea.children).forEach(c => { if (c !== debugEmpty) c.remove(); });
        debugEmpty.style.display = '';
        exchanges.length = 0;
    }

    function appendMessage(role, text, isError) {
        emptyState.style.display = 'none';

        const wrapper = document.createElement('div');
        wrapper.className = 'message ' + (isError ? 'error' : role);

        const label = document.createElement('div');
        label.className = 'message-label';
        label.textContent = role === 'user' ? 'You' : 'Assistant';
        wrapper.appendChild(label);

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        wrapper.appendChild(bubble);

        chatArea.appendChild(wrapper);
        chatArea.scrollTop = chatArea.scrollHeight;
        return wrapper;
    }

    function appendThinking() {
        emptyState.style.display = 'none';

        const wrapper = document.createElement('div');
        wrapper.className = 'message thinking';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';

        const spinner = document.createElement('div');
        spinner.className = 'spinner';
        bubble.appendChild(spinner);

        const text = document.createElement('span');
        text.textContent = 'Thinking…';
        bubble.appendChild(text);

        wrapper.appendChild(bubble);
        chatArea.appendChild(wrapper);
        chatArea.scrollTop = chatArea.scrollHeight;
        return wrapper;
    }

    function appendAssistantMessage(answer, evidence) {
        emptyState.style.display = 'none';

        const wrapper = document.createElement('div');
        wrapper.className = 'message assistant';

        const label = document.createElement('div');
        label.className = 'message-label';
        label.textContent = 'Assistant';
        wrapper.appendChild(label);

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = answer;
        wrapper.appendChild(bubble);

        const hasToolCalls = evidence && evidence.toolCalls && evidence.toolCalls.length > 0;
        const hasRag = evidence && evidence.ragDocuments && evidence.ragDocuments.length > 0;

        if (hasToolCalls || hasRag) {
            const toggle = document.createElement('button');
            toggle.className = 'evidence-toggle';
            toggle.setAttribute('aria-expanded', 'false');
            toggle.textContent = '▶ Sources / Evidence';

            const panel = document.createElement('div');
            panel.className = 'evidence-panel';

            if (hasRag) {
                const section = document.createElement('div');
                section.className = 'evidence-section';

                const h4 = document.createElement('h4');
                h4.textContent = 'RAG Documents';
                section.appendChild(h4);

                evidence.ragDocuments.forEach(doc => {
                    const item = document.createElement('div');
                    item.className = 'evidence-item';

                    const tag = document.createElement('span');
                    tag.className = 'tag tag-rag';
                    tag.textContent = 'RAG';
                    item.appendChild(tag);

                    const detail = document.createTextNode(
                        (doc.sourceId || 'unknown') +
                        (doc.section ? ' — ' + doc.section : '') +
                        (doc.chunkIndex !== undefined ? ' [chunk ' + doc.chunkIndex + ']' : '')
                    );
                    item.appendChild(detail);
                    section.appendChild(item);
                });

                panel.appendChild(section);
            }

            if (hasToolCalls) {
                const section = document.createElement('div');
                section.className = 'evidence-section';

                const h4 = document.createElement('h4');
                h4.textContent = 'MCP Tool Calls';
                section.appendChild(h4);

                evidence.toolCalls.forEach(tc => {
                    const item = document.createElement('div');
                    item.className = 'evidence-item';

                    const isErr = tc.outcome === 'ERROR' || tc.invocationStatus === 'FAILED';
                    const tag = document.createElement('span');
                    tag.className = 'tag ' + (isErr ? 'tag-error' : 'tag-mcp');
                    tag.textContent = 'MCP';
                    item.appendChild(tag);

                    const detail = document.createTextNode(
                        (tc.server || '') + ' → ' + (tc.tool || '') +
                        (tc.outcome && tc.outcome !== 'OK' ? ' (' + tc.outcome + ')' : '')
                    );
                    item.appendChild(detail);
                    section.appendChild(item);
                });

                panel.appendChild(section);
            }

            toggle.addEventListener('click', () => {
                const open = panel.classList.toggle('open');
                toggle.setAttribute('aria-expanded', open);
                toggle.textContent = (open ? '▼' : '▶') + ' Sources / Evidence';
            });

            wrapper.appendChild(toggle);
            wrapper.appendChild(panel);
        }

        chatArea.appendChild(wrapper);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    async function sendMessage() {
        const question = input.value.trim();
        if (!question) return;

        appendMessage('user', question, false);
        input.value = '';
        input.style.height = '48px';
        input.disabled = true;
        sendBtn.disabled = true;

        const thinkingEl = appendThinking();
        const startTime = Date.now();

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question })
            });

            const elapsedMs = Date.now() - startTime;
            thinkingEl.remove();

            if (!response.ok) {
                let errorMsg = 'Request failed (HTTP ' + response.status + '). Check whether Ollama and MCP services are running.';
                try {
                    const err = await response.json();
                    if (err.message) errorMsg += '\n\nDetail: ' + err.message;
                } catch (_) {}
                appendMessage('assistant', errorMsg, true);
                return;
            }

            const data = await response.json();
            appendAssistantMessage(data.answer || '(no answer)', data.evidence);

            // Record exchange for debug tab
            const exchange = { question, answer: data.answer, evidence: data.evidence, requestId: data.requestId, elapsedMs };
            exchanges.push(exchange);
            addDebugCard(exchange);

        } catch (err) {
            thinkingEl.remove();
            appendMessage('assistant',
                'Request failed. Check whether Ollama and MCP services are running.\n\nDetail: ' + err.message,
                true);
        } finally {
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }
    }
</script>
