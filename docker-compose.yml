services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cdq_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-cdq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdq_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cdq}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
