name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    name: Offline Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run offline tests
        run: ./mvnw test --no-transfer-progress
        env:
          # CI uses placeholder values — no secrets needed for offline tests
          REST_COUNTRIES_API_KEY: placeholder
          WEATHER_API_KEY: placeholder
